<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Good Food — заказ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="../admin/css/theme.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:var(--font); background:var(--bg); color:var(--ink);
         min-height:100vh; display:grid; place-items:center; padding:24px; }
  .box { width:100%; max-width:340px; text-align:center; }
  .mark { width:56px; height:56px; margin:0 auto 14px; border-radius:var(--r-lg);
          background:var(--brand); color:#fff; display:grid; place-items:center;
          font-weight:800; font-size:20px; }
  h1 { font-size:20px; margin:0 0 4px; }
  p  { color:var(--ink-3); margin:0 0 20px; font-size:14px; }
  input { width:100%; padding:14px; text-align:center; font-size:20px; font-weight:800;
          letter-spacing:6px; text-transform:uppercase; border:1px solid var(--line-strong);
          border-radius:var(--r-md); background:var(--surface); color:var(--ink); }
  input:focus { outline:0; border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft); }
  button { width:100%; margin-top:12px; padding:14px; border:0; border-radius:var(--r-md);
           background:var(--brand); color:#fff; font-weight:800; font-size:15px; cursor:pointer; }
  .err { color:var(--danger); font-size:13px; margin-top:10px; min-height:18px; }
</style>
</head>
<body>
<div class="box">
  <div class="mark">GF</div>
  <div id="view"></div>
</div>

<script type="module">
  const tg = window.Telegram?.WebApp;
  tg?.ready(); tg?.expand();

  const view = document.getElementById('view');

  async function me() {
    const r = await fetch('/api/auth/user/me', { credentials: 'same-origin' });
    return r.ok ? r.json() : null;
  }

  function renderLogin() {
    view.innerHTML = `
      <h1>Вход по коду</h1>
      <p>Введите код компании, выданный менеджером.</p>
      <form id="f">
        <input id="code" maxlength="12" autocomplete="one-time-code" placeholder="XXXXXX" required>
        <button type="submit">Войти</button>
        <div class="err" id="err"></div>
      </form>`;
    document.getElementById('f').onsubmit = async (e) => {
      e.preventDefault();
      const err = document.getElementById('err');
      err.textContent = '';
      const res = await fetch('/api/auth/user/login', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: document.getElementById('code').value.trim() })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) { err.textContent = data.error === 'Access disabled' ? 'Доступ закрыт' : 'Неверный код'; return; }
      renderHome(data);
    };
  }

  function renderHome(user) {
    view.innerHTML = `
      <h1>${user.user_name || 'Компания'}</h1>
      <p>Каталог и оформление заказа появятся на следующем этапе.</p>
      <button id="out">Выйти</button>`;
    document.getElementById('out').onclick = async () => {
      await fetch('/api/auth/user/logout', { method: 'POST', credentials: 'same-origin' });
      renderLogin();
    };
  }

  const user = await me();
  user ? renderHome(user) : renderLogin();
</script>
</body>
</html>
