<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Good Food — Админ панель</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="./css/theme.css">
<link rel="stylesheet" href="./css/admin.css">
<link rel="stylesheet" href="/loader.css">

<!-- The module graph is deep enough that discovering it one import at a
     time costs a visible wait; naming every file here lets the browser
     fetch the whole panel in one go. -->
<link rel="modulepreload" href="./js/app.js">
<link rel="modulepreload" href="./js/api.js">
<link rel="modulepreload" href="./js/ui.js">
<link rel="modulepreload" href="./js/icons.js">
<link rel="modulepreload" href="./js/prefs.js">
<link rel="modulepreload" href="./js/xlsx.js">
<link rel="modulepreload" href="./js/invoice.js">
<link rel="modulepreload" href="/loader.js">
<link rel="modulepreload" href="./js/panels/orders.js">
<link rel="modulepreload" href="./js/panels/items.js">
<link rel="modulepreload" href="./js/panels/users.js">
<link rel="modulepreload" href="./js/panels/settings.js">
<link rel="modulepreload" href="./js/panels/messages.js">
<link rel="modulepreload" href="./js/panels/reminders.js">
</head>
<body>

<!-- ── boot splash ────────────────────────────────────────────
     Inline markup, not built by script: it has to be on screen while the
     modules are still downloading, which is exactly when there is nothing
     else to look at. app.js takes it away. -->
<div class="splash" id="splash">
  <div class="sushi">
    <div class="sushi__row">
      <div class="roll-wrap"><div class="shadow"></div><div class="roll salmon"><div class="roll-inner"><div class="nori"></div><div class="rice"><div class="topping"></div></div></div></div></div>
      <div class="roll-wrap"><div class="shadow"></div><div class="roll tamago"><div class="roll-inner"><div class="nori"></div><div class="rice"><div class="topping"></div></div></div></div></div>
      <div class="roll-wrap"><div class="shadow"></div><div class="roll avocado"><div class="roll-inner"><div class="nori"></div><div class="rice"><div class="topping"></div></div></div></div></div>
      <div class="roll-wrap"><div class="shadow"></div><div class="roll tuna"><div class="roll-inner"><div class="nori"></div><div class="rice"><div class="topping"></div></div></div></div></div>
      <div class="roll-wrap"><div class="shadow"></div><div class="roll cucumber"><div class="roll-inner"><div class="nori"></div><div class="rice"><div class="topping"></div></div></div></div></div>
    </div>
    <div class="sushi__label">Загрузка панели…</div>
  </div>
</div>

<!-- ── login ──────────────────────────────────────────────── -->
<div class="login" id="login" hidden>
  <div class="login__box">
    <div class="login__brand">
      <div class="nav__mark">GF</div>
      <div class="nav__name">Good Food<small>Панель управления</small></div>
    </div>
    <!-- A real login form, method/action and all: the fields are typed so a
         password manager recognises them and offers to save. The submit is
         still handled in JS — the action is only there for the browsers that
         want to see one. -->
    <form class="card" id="login-form" method="post" action="/api/auth/admin/login">
      <div class="card__body">
        <div class="field">
          <label class="field__label" for="login-chat">Логин</label>
          <input class="input input--code" id="login-chat" name="chat_id" type="text" inputmode="numeric"
                 autocomplete="username" spellcheck="false" maxlength="20" required autofocus>
        </div>
        <div class="field">
          <label class="field__label" for="login-code">Пароль</label>
          <input class="input input--code" id="login-code" name="code" type="password"
                 autocomplete="current-password"
                 autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="32" required>
        </div>
        <button class="btn btn--primary btn--block" type="submit">Войти</button>
        <p class="hint" id="login-error" style="color:var(--danger)" hidden></p>
      </div>
    </form>
  </div>
</div>

<!-- ── app shell ──────────────────────────────────────────── -->
<div class="shell" id="shell" hidden>

  <!-- left navigation -->
  <nav class="nav" aria-label="Основная навигация">
    <div class="nav__brand">
      <div class="nav__mark">GF</div>
      <div class="nav__name">Good Food<small>Админ панель</small></div>
    </div>
    <ul class="nav__list" id="nav-list"></ul>
    <div class="nav__foot">
      <button class="nav__link" id="compact-btn">
        <span class="nav__icon" data-icon="panel-right"></span>
        <span class="nav__label">Свернуть меню</span>
      </button>
      <button class="nav__link" id="theme-btn">
        <span class="nav__icon" data-icon="moon"></span>
        <span class="nav__label">Тёмная тема</span>
      </button>
      <button class="nav__link" id="logout-btn">
        <span class="nav__icon" data-icon="logout"></span>
        <span class="nav__label">Выйти</span>
      </button>
    </div>
  </nav>

  <!-- main content -->
  <main class="main">
    <header class="topbar">
      <div>
        <div class="topbar__title" id="page-title">Заказы</div>
        <div class="topbar__sub" id="page-sub"></div>
      </div>
      <div class="topbar__spacer"></div>
      <div id="page-actions" style="display:flex;gap:8px"></div>
    </header>
    <div class="content" id="content"></div>
  </main>

</div>

<div class="toasts" id="toasts"></div>
<div id="modal-root"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
