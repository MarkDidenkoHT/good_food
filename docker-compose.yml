name: goodfood

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: goodfood
      POSTGRES_USER: goodfood
      # the database has no port outside Docker, so a default is safe enough
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goodfood}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goodfood -d goodfood"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    image: goodfood-app
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://goodfood:${POSTGRES_PASSWORD:-goodfood}@db:5432/goodfood
      UPLOADS_DIR: /data/uploads
      BACKUP_DIR: /data/backups
      PORT: "3000"
    # loopback only; the internet comes in through the https reverse proxy
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - uploads:/data/uploads
      - backups:/data/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  backups:
